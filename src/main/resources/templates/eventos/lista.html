<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Eventos</title>
<!-- Compiled and minified CSS -->
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

<!-- Compiled and minified JavaScript -->
<script
	src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</head>
<body>
	<div th:replace="~{menu :: menu}"></div>
	<div class="container">


		<h1>Lista de Eventos</h1>

		<table>

			<thead>
				<tr>
					<th>Id</th>
					<th>Nome</th>
					<th>Local</th>
					<th>Data</th>
					<th>Horário</th>
				</tr>
			</thead>
			<tbody>
			<tr th:each="e : ${eventos}">
			<td th:text="${e.id}">1</td>		
			<td><a th:href="@{/eventos/{id}(id=${e.id})}"><span th:text="${e.Nome}">Aniversário de João</span></td></a>
			<td th:text="${e.Local}">Clube</td>
			<td th:text="${e.Data}">25/02/2021</td>
			<td th:text="${e.Horario}">19:00</td>
			</tr>
			</tbody>
		</table>
	</div>
</body>
</html>
