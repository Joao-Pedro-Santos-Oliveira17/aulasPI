<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Eventos</title>
<!-- Compiled and minified CSS -->
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

<!-- Compiled and minified JavaScript -->
<script
	src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</head>
<body>
	<div th:replace="~{menu :: menu}"></div>
	<div class="container">


		<h1>Adcionar Evento</h1>

		<form action="/eventos" method="post">

			<div>
				<label>Nome:</label> <input type="text" name="nome">
			</div>
			<div>
				<label>Local:</label> <input type="text" name="local">
			</div>
			<div>
				<label>Data:</label> <input type="text" name="data">
			</div>
			<div>
				<label>Horário:</label> <input type="text" name="horario">
			</div>
			<div>
				<button type="submit" class="waves-effect waves-light btn">Salvar</button>
				<button type="reset" class="waves-effect waves-light btn">Limpar</button>
			</div>

		</form>
	</div>
</body>
</html>
